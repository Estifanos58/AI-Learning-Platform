services:
  # =============================================================================
  # INFRASTRUCTURE: Internal-only Event Streaming, Caching & Vector Storage
  # Internal infrastructure ports are NOT published to the host by default.
  # For local debugging port mappings, use:
  #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
  # =============================================================================

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aiplatform-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID must be set}
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx512m}
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'cat < /dev/null > /dev/tcp/localhost/29092'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - ai-platform-network

  redis:
    image: redis:7.2-alpine
    container_name: aiplatform-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-platform-network

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: aiplatform-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ai-platform-network

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: aiplatform-tei
    restart: unless-stopped
    command: --model-id ${TEI_MODEL:-BAAI/bge-large-en-v1.5} --port 80
    volumes:
      - tei_models:/data
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 20s
    networks:
      - ai-platform-network

  # =============================================================================
  # DATABASES: Isolated Internal-only Service Datastores
  # =============================================================================

  postgres:
    image: postgres:15-alpine
    container_name: aiplatform-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:?AUTH_DB_USER must be set}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-platform-network

  profile-postgres:
    image: postgres:15-alpine
    container_name: aiplatform-postgres-profile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PROFILE_DB_NAME:-user_profile_db}
      POSTGRES_USER: ${PROFILE_DB_USER:?PROFILE_DB_USER must be set}
      POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD:?PROFILE_DB_PASSWORD must be set}
    volumes:
      - profile_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-platform-network

  file-postgres:
    image: postgres:15-alpine
    container_name: aiplatform-postgres-file
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FILE_DB_NAME:-file_service_db}
      POSTGRES_USER: ${FILE_DB_USER:?FILE_DB_USER must be set}
      POSTGRES_PASSWORD: ${FILE_DB_PASSWORD:?FILE_DB_PASSWORD must be set}
    volumes:
      - file_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-platform-network

  chat-postgres:
    image: postgres:15-alpine
    container_name: aiplatform-postgres-chat
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CHAT_DB_NAME:-chat_service_db}
      POSTGRES_USER: ${CHAT_DB_USER:?CHAT_DB_USER must be set}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:?CHAT_DB_PASSWORD must be set}
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-platform-network

  rag-postgres:
    image: postgres:15-alpine
    container_name: aiplatform-postgres-rag
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RAG_DB_NAME:-rag_db}
      POSTGRES_USER: ${RAG_DB_USER:?RAG_DB_USER must be set}
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:?RAG_DB_PASSWORD must be set}
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-platform-network

  # =============================================================================
  # BACKEND MICROSERVICES: Internal Business Logic, gRPC & Worker Services
  # =============================================================================

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: aiplatform-auth-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    secrets:
      - source: jwt_private_key
        target: jwt_private_key.pem
      - source: jwt_public_key
        target: jwt_public_key.pem
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: 8082
      GRPC_SERVER_PORT: 9090
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${AUTH_DB_NAME:-auth_db}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER:?AUTH_DB_USER must be set}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD must be set}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m}
      APP_GRPC_AUTH_SERVICE_SECRET: ${APP_GRPC_AUTH_SERVICE_SECRET:?APP_GRPC_AUTH_SERVICE_SECRET must be set}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-ai-learning-platform-auth}
      APP_JWT_AUDIENCE: ${APP_JWT_AUDIENCE:-ai-learning-platform-clients}
      APP_JWT_KEY_ID: ${APP_JWT_KEY_ID:-primary}
      APP_JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/jwt_private_key.pem
      APP_JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public_key.pem
      APP_KAFKA_TOPIC_USER_REGISTERED: user.registered.v1
      APP_KAFKA_TOPIC_USER_EMAIL_VERIFICATION: user.email.verification.v1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082 && printf \"GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - ai-platform-network

  user-profile-service:
    build:
      context: ./backend
      dockerfile: user-profile-service/Dockerfile
    container_name: aiplatform-profile-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      profile-postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: 8083
      GRPC_SERVER_PORT: 9091
      SPRING_DATASOURCE_URL: jdbc:postgresql://profile-postgres:5432/${PROFILE_DB_NAME:-user_profile_db}
      SPRING_DATASOURCE_USERNAME: ${PROFILE_DB_USER:?PROFILE_DB_USER must be set}
      SPRING_DATASOURCE_PASSWORD: ${PROFILE_DB_PASSWORD:?PROFILE_DB_PASSWORD must be set}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m}
      APP_GRPC_PROFILE_SERVICE_SECRET: ${APP_GRPC_PROFILE_SERVICE_SECRET:?APP_GRPC_PROFILE_SERVICE_SECRET must be set}
      APP_KAFKA_TOPIC_USER_REGISTERED: user.registered.v1
      APP_KAFKA_TOPIC_USER_REGISTERED_DLT: user.registered.dlt
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8083 && printf \"GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - ai-platform-network

  file-service:
    build:
      context: ./backend
      dockerfile: file-service/Dockerfile
    container_name: aiplatform-file-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      file-postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: 8084
      GRPC_SERVER_PORT: 9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://file-postgres:5432/${FILE_DB_NAME:-file_service_db}
      SPRING_DATASOURCE_USERNAME: ${FILE_DB_USER:?FILE_DB_USER must be set}
      SPRING_DATASOURCE_PASSWORD: ${FILE_DB_PASSWORD:?FILE_DB_PASSWORD must be set}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m}
      FILE_STORAGE_ROOT_PATH: /data
      APP_GRPC_FILE_SERVICE_SECRET: ${APP_GRPC_FILE_SERVICE_SECRET:?APP_GRPC_FILE_SERVICE_SECRET must be set}
      APP_KAFKA_FILE_EVENTS_ENABLED: "true"
      APP_KAFKA_TOPIC_FILE_UPLOADED: file.uploaded.v1
      APP_KAFKA_TOPIC_FILE_UPLOADED_V2: file.uploaded.v2
      APP_KAFKA_TOPIC_FILE_DELETED: file.deleted.v1
    volumes:
      - file_storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8084 && printf \"GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - ai-platform-network

  chat-service:
    build:
      context: ./backend
      dockerfile: chat-service/Dockerfile
    container_name: aiplatform-chat-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      chat-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      file-service:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: 8085
      GRPC_SERVER_PORT: 9095
      SPRING_DATASOURCE_URL: jdbc:postgresql://chat-postgres:5432/${CHAT_DB_NAME:-chat_service_db}
      SPRING_DATASOURCE_USERNAME: ${CHAT_DB_USER:?CHAT_DB_USER must be set}
      SPRING_DATASOURCE_PASSWORD: ${CHAT_DB_PASSWORD:?CHAT_DB_PASSWORD must be set}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      GRPC_FILE_ADDRESS: dns:///file-service:9092
      GRPC_RAG_ADDRESS: dns:///rag-service:9097
      APP_GRPC_CHAT_SERVICE_SECRET: ${APP_GRPC_CHAT_SERVICE_SECRET:?APP_GRPC_CHAT_SERVICE_SECRET must be set}
      APP_GRPC_FILE_SERVICE_SECRET: ${APP_GRPC_FILE_SERVICE_SECRET:?APP_GRPC_FILE_SERVICE_SECRET must be set}
      APP_GRPC_RAG_SERVICE_SECRET: ${APP_GRPC_RAG_SERVICE_SECRET:?APP_GRPC_RAG_SERVICE_SECRET must be set}
      APP_KAFKA_TOPIC_AI_MESSAGE: ai.message.requested.v2
      APP_KAFKA_TOPIC_AI_MESSAGE_V2: ai.message.requested.v2
      APP_KAFKA_TOPIC_AI_MESSAGE_CHUNK: ai.message.chunk.v2
      APP_KAFKA_TOPIC_AI_MESSAGE_COMPLETED: ai.message.completed.v2
      APP_KAFKA_TOPIC_AI_MESSAGE_FAILED: ai.message.failed.v2
      APP_KAFKA_TOPIC_AI_MESSAGE_CANCELLED: ai.message.cancelled.v2
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8085 && printf \"GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - ai-platform-network

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: aiplatform-notification-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: notification-service-v1
      KAFKA_TOPIC_EMAIL_VERIFICATION: user.email.verification.v1
      KAFKA_TOPIC_EMAIL_FAILED: notification.email.failed.v1
      IDEMPOTENCY_BACKEND: ${IDEMPOTENCY_BACKEND:-redis}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@ai-learning-platform.local}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8086/ready')\""]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - ai-platform-network

  rag-service:
    build:
      context: ./backend/rag-service
      dockerfile: Dockerfile
    container_name: aiplatform-rag-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rag-postgres:
        condition: service_healthy
      tei:
        condition: service_healthy
      file-service:
        condition: service_healthy
    environment:
      RAG_HOST: 0.0.0.0
      RAG_PORT: 8087
      RAG_GRPC_HOST: 0.0.0.0
      RAG_GRPC_PORT: 9097
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_KEY_ENCRYPTION_SECRET: ${AI_KEY_ENCRYPTION_SECRET:?AI_KEY_ENCRYPTION_SECRET must be set}
      AI_KEY_ENCRYPTION_PREVIOUS_SECRETS: ${AI_KEY_ENCRYPTION_PREVIOUS_SECRETS:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: rag-service-v2
      KAFKA_TOPIC_FILE_UPLOADED_V2: file.uploaded.v2
      KAFKA_TOPIC_FILE_DELETED_V1: file.deleted.v1
      KAFKA_TOPIC_AI_MESSAGE_REQUESTED_V2: ai.message.requested.v2
      KAFKA_TOPIC_AI_MESSAGE_CANCELLED_V2: ai.message.cancelled.v2
      KAFKA_TOPIC_AI_MESSAGE_CHUNK_V2: ai.message.chunk.v2
      KAFKA_TOPIC_AI_MESSAGE_COMPLETED_V2: ai.message.completed.v2
      KAFKA_TOPIC_AI_MESSAGE_FAILED_V2: ai.message.failed.v2
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-rag_chunks_prod}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-1024}
      TEI_BASE_URL: http://tei:80
      TEI_MODEL: ${TEI_MODEL:-BAAI/bge-large-en-v1.5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      FILE_STORAGE_ROOT_PATH: /data
      GRPC_FILE_SERVICE_ADDRESS: file-service:9092
      APP_GRPC_SERVICE_SECRET: ${APP_GRPC_RAG_SERVICE_SECRET:?APP_GRPC_RAG_SERVICE_SECRET must be set}
      RAG_DATABASE_URL: postgresql+asyncpg://${RAG_DB_USER:?RAG_DB_USER must be set}:${RAG_DB_PASSWORD:?RAG_DB_PASSWORD must be set}@rag-postgres:5432/${RAG_DB_NAME:-rag_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      STREAM_BACKEND: ${STREAM_BACKEND:-dual}
    volumes:
      - file_storage_data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8087/ready')\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - ai-platform-network

  # =============================================================================
  # PUBLIC EDGE: API Gateway & Web Client
  # =============================================================================

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: aiplatform-api-gateway
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      user-profile-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    secrets:
      - source: jwt_public_key
        target: jwt_public_key.pem
    environment:
      APP_ENV: ${APP_ENV:-production}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m}
      SERVER_PORT: 8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:?GATEWAY_ALLOWED_ORIGINS must be set}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-ai-learning-platform-auth}
      APP_JWT_AUDIENCE: ${APP_JWT_AUDIENCE:-ai-learning-platform-clients}
      APP_JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public_key.pem
      APP_AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-true}
      APP_AUTH_COOKIE_SAME_SITE: ${APP_AUTH_COOKIE_SAME_SITE:-Lax}
      APP_AUTH_COOKIE_DOMAIN: ${APP_AUTH_COOKIE_DOMAIN:-}
      APP_AUTH_EXPOSE_TOKENS_IN_BODY: ${APP_AUTH_EXPOSE_TOKENS_IN_BODY:-false}
      GRPC_AUTH_ADDRESS: dns:///auth-service:9090
      GRPC_PROFILE_ADDRESS: dns:///user-profile-service:9091
      GRPC_FILE_ADDRESS: dns:///file-service:9092
      GRPC_CHAT_ADDRESS: dns:///chat-service:9095
      GRPC_RAG_ADDRESS: dns:///rag-service:9097
      APP_GRPC_AUTH_SERVICE_SECRET: ${APP_GRPC_AUTH_SERVICE_SECRET:?APP_GRPC_AUTH_SERVICE_SECRET must be set}
      APP_GRPC_PROFILE_SERVICE_SECRET: ${APP_GRPC_PROFILE_SERVICE_SECRET:?APP_GRPC_PROFILE_SERVICE_SECRET must be set}
      APP_GRPC_FILE_SERVICE_SECRET: ${APP_GRPC_FILE_SERVICE_SECRET:?APP_GRPC_FILE_SERVICE_SECRET must be set}
      APP_GRPC_CHAT_SERVICE_SECRET: ${APP_GRPC_CHAT_SERVICE_SECRET:?APP_GRPC_CHAT_SERVICE_SECRET must be set}
      APP_GRPC_RAG_SERVICE_SECRET: ${APP_GRPC_RAG_SERVICE_SECRET:?APP_GRPC_RAG_SERVICE_SECRET must be set}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - ai-platform-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
    container_name: aiplatform-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api-gateway:8080/api}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ai-platform-network

# =============================================================================
# SECRETS, VOLUMES & NETWORKS
# =============================================================================

secrets:
  jwt_private_key:
    file: ${JWT_PRIVATE_KEY_FILE:-./secrets/jwt_private_key.pem}
  jwt_public_key:
    file: ${JWT_PUBLIC_KEY_FILE:-./secrets/jwt_public_key.pem}

volumes:
  auth_postgres_data:
    name: aiplatform_auth_postgres_data
  profile_postgres_data:
    name: aiplatform_profile_postgres_data
  file_postgres_data:
    name: aiplatform_file_postgres_data
  chat_postgres_data:
    name: aiplatform_chat_postgres_data
  rag_postgres_data:
    name: aiplatform_rag_postgres_data
  file_storage_data:
    name: aiplatform_file_storage_data
  redis_data:
    name: aiplatform_redis_data
  qdrant_data:
    name: aiplatform_qdrant_data
  tei_models:
    name: aiplatform_tei_models

networks:
  ai-platform-network:
    name: ai-platform-network
    driver: bridge
