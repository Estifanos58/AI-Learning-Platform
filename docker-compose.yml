services:
  # =============================================================================
  # INFRASTRUCTURE: Core Event Streaming, Caching & Vector Storage
  # =============================================================================

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aiplatform-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'cat < /dev/null > /dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - ai-platform-network

  redis:
    image: redis:7.2-alpine
    container_name: aiplatform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-platform-network

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: aiplatform-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ai-platform-network

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: aiplatform-tei
    restart: unless-stopped
    command: --model-id BAAI/bge-large-en-v1.5 --port 80
    ports:
      - "${TEI_HOST_PORT:-8088}:80"
    volumes:
      - tei_models:/data
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    networks:
      - ai-platform-network

  # =============================================================================
  # DATABASES: Isolated Service Datastores
  # =============================================================================

  postgres:
    image: postgres:15-alpine
    container_name: aiplatform-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
      POSTGRES_USER: ${AUTH_DB_USER:-auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
    ports:
      - "${AUTH_DB_HOST_PORT:-5432}:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-auth_user} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-platform-network

  profile-postgres:
    image: postgres:15-alpine
    container_name: aiplatform-postgres-profile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PROFILE_DB_NAME:-user_profile_db}
      POSTGRES_USER: ${PROFILE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD:-postgres}
    ports:
      - "${PROFILE_DB_HOST_PORT:-5433}:5432"
    volumes:
      - profile_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROFILE_DB_USER:-postgres} -d ${PROFILE_DB_NAME:-user_profile_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-platform-network

  file-postgres:
    image: postgres:15-alpine
    container_name: aiplatform-postgres-file
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FILE_DB_NAME:-file_service_db}
      POSTGRES_USER: ${FILE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${FILE_DB_PASSWORD:-postgres}
    ports:
      - "${FILE_DB_HOST_PORT:-5434}:5432"
    volumes:
      - file_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FILE_DB_USER:-postgres} -d ${FILE_DB_NAME:-file_service_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-platform-network

  chat-postgres:
    image: postgres:15-alpine
    container_name: aiplatform-postgres-chat
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CHAT_DB_NAME:-chat_service_db}
      POSTGRES_USER: ${CHAT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-postgres}
    ports:
      - "${CHAT_DB_HOST_PORT:-5435}:5432"
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHAT_DB_USER:-postgres} -d ${CHAT_DB_NAME:-chat_service_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-platform-network

  rag-postgres:
    image: postgres:15-alpine
    container_name: aiplatform-postgres-rag
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RAG_DB_NAME:-rag_db}
      POSTGRES_USER: ${RAG_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-postgres}
    ports:
      - "${RAG_DB_HOST_PORT:-5436}:5432"
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAG_DB_USER:-postgres} -d ${RAG_DB_NAME:-rag_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-platform-network

  # =============================================================================
  # BACKEND MICROSERVICES: Business Logic, gRPC & Worker Services
  # =============================================================================

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: aiplatform-auth-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${AUTH_DB_NAME:-auth_db}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER:-auth_user}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GRPC_SERVER_PORT: 9090
      APP_GRPC_AUTH_SERVICE_SECRET: ${APP_GRPC_AUTH_SERVICE_SECRET:-change-me-shared-secret}
      APP_KAFKA_TOPIC_USER_REGISTERED: user.registered.v1
      APP_KAFKA_TOPIC_USER_EMAIL_VERIFICATION: user.email.verification.v1
    ports:
      - "${AUTH_GRPC_HOST_PORT:-9090}:9090"
    networks:
      - ai-platform-network

  user-profile-service:
    build:
      context: ./backend
      dockerfile: user-profile-service/Dockerfile
    container_name: aiplatform-profile-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      profile-postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://profile-postgres:5432/${PROFILE_DB_NAME:-user_profile_db}
      SPRING_DATASOURCE_USERNAME: ${PROFILE_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${PROFILE_DB_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GRPC_SERVER_PORT: 9091
      APP_GRPC_PROFILE_SERVICE_SECRET: ${APP_GRPC_PROFILE_SERVICE_SECRET:-change-me-shared-secret}
      APP_KAFKA_TOPIC_USER_REGISTERED: user.registered.v1
      APP_KAFKA_TOPIC_USER_REGISTERED_DLT: user.registered.dlt
    ports:
      - "${PROFILE_GRPC_HOST_PORT:-9091}:9091"
    networks:
      - ai-platform-network

  file-service:
    build:
      context: ./backend
      dockerfile: file-service/Dockerfile
    container_name: aiplatform-file-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      file-postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://file-postgres:5432/${FILE_DB_NAME:-file_service_db}
      SPRING_DATASOURCE_USERNAME: ${FILE_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${FILE_DB_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GRPC_SERVER_PORT: 9092
      FILE_STORAGE_ROOT_PATH: /data
      APP_GRPC_FILE_SERVICE_SECRET: ${APP_GRPC_FILE_SERVICE_SECRET:-change-me-shared-secret}
      APP_KAFKA_FILE_EVENTS_ENABLED: "true"
      APP_KAFKA_TOPIC_FILE_UPLOADED: file.uploaded.v1
      APP_KAFKA_TOPIC_FILE_UPLOADED_V2: file.uploaded.v2
      APP_KAFKA_TOPIC_FILE_DELETED: file.deleted.v1
    volumes:
      - file_storage_data:/data
    ports:
      - "${FILE_GRPC_HOST_PORT:-9094}:9092"
    networks:
      - ai-platform-network

  chat-service:
    build:
      context: ./backend
      dockerfile: chat-service/Dockerfile
    container_name: aiplatform-chat-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      chat-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      file-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://chat-postgres:5432/${CHAT_DB_NAME:-chat_service_db}
      SPRING_DATASOURCE_USERNAME: ${CHAT_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${CHAT_DB_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      GRPC_SERVER_PORT: 9095
      GRPC_FILE_ADDRESS: dns:///file-service:9092
      APP_GRPC_CHAT_SERVICE_SECRET: ${APP_GRPC_CHAT_SERVICE_SECRET:-change-me-shared-secret}
      APP_GRPC_FILE_SERVICE_SECRET: ${APP_GRPC_FILE_SERVICE_SECRET:-change-me-shared-secret}
      APP_KAFKA_TOPIC_AI_MESSAGE: ai.message.requested
      APP_KAFKA_TOPIC_AI_MESSAGE_V2: ai.message.requested.v2
      APP_KAFKA_TOPIC_AI_MESSAGE_CHUNK: ai.message.chunk.v1
      APP_KAFKA_TOPIC_AI_MESSAGE_COMPLETED: ai.message.completed.v1
      APP_KAFKA_TOPIC_AI_MESSAGE_FAILED: ai.message.failed.v1
      APP_KAFKA_TOPIC_AI_MESSAGE_CANCELLED: ai.message.cancelled.v1
    ports:
      - "${CHAT_GRPC_HOST_PORT:-9095}:9095"
    networks:
      - ai-platform-network

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: aiplatform-notification-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: notification-service-v1
      KAFKA_TOPIC_EMAIL_VERIFICATION: user.email.verification.v1
      KAFKA_TOPIC_EMAIL_FAILED: notification.email.failed.v1
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@aiplatform.local}
    ports:
      - "${NOTIFICATION_HOST_PORT:-8086}:8086"
    networks:
      - ai-platform-network

  rag-service:
    build:
      context: ./backend/rag-service
      dockerfile: Dockerfile
    container_name: aiplatform-rag-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rag-postgres:
        condition: service_healthy
      tei:
        condition: service_started
      file-service:
        condition: service_started
    environment:
      RAG_HOST: 0.0.0.0
      RAG_PORT: 8087
      RAG_GRPC_HOST: 0.0.0.0
      RAG_GRPC_PORT: 9097
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENCRYPTION_KEY: ${RAG_ENCRYPTION_KEY:-local-dev-rag-encryption-key-32-bytes}
      AI_KEY_ENCRYPTION_SECRET: ${AI_KEY_ENCRYPTION_SECRET:-local-dev-rag-encryption-key-32-bytes}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: rag-service-v1
      KAFKA_TOPIC_FILE_UPLOADED_V2: file.uploaded.v2
      KAFKA_TOPIC_FILE_DELETED_V1: file.deleted.v1
      KAFKA_TOPIC_AI_MESSAGE_REQUESTED_V2: ai.message.requested.v2
      KAFKA_TOPIC_AI_MESSAGE_CANCELLED_V1: ai.message.cancelled.v1
      KAFKA_TOPIC_AI_MESSAGE_CHUNK_V1: ai.message.chunk.v1
      KAFKA_TOPIC_AI_MESSAGE_COMPLETED_V1: ai.message.completed.v1
      KAFKA_TOPIC_AI_MESSAGE_FAILED_V1: ai.message.failed.v1
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-rag_chunks_prod}
      TEI_BASE_URL: http://tei:80
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      FILE_STORAGE_ROOT_PATH: /data
      GRPC_FILE_SERVICE_ADDRESS: file-service:9092
      APP_GRPC_SERVICE_SECRET: ${APP_GRPC_RAG_SERVICE_SECRET:-change-me-shared-secret}
      RAG_DATABASE_URL: postgresql+asyncpg://${RAG_DB_USER:-postgres}:${RAG_DB_PASSWORD:-postgres}@rag-postgres:5432/${RAG_DB_NAME:-rag_db}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - file_storage_data:/data:ro
    ports:
      - "${RAG_HTTP_HOST_PORT:-8087}:8087"
      - "${RAG_GRPC_HOST_PORT:-9097}:9097"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8087/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - ai-platform-network

  # =============================================================================
  # GATEWAY & FRONTEND: Public API Ingress & Client Application
  # =============================================================================

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: aiplatform-api-gateway
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      user-profile-service:
        condition: service_started
      file-service:
        condition: service_started
      chat-service:
        condition: service_started
      rag-service:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-http://localhost:3000}
      GRPC_AUTH_ADDRESS: dns:///auth-service:9090
      GRPC_PROFILE_ADDRESS: dns:///user-profile-service:9091
      GRPC_FILE_ADDRESS: dns:///file-service:9092
      GRPC_CHAT_ADDRESS: dns:///chat-service:9095
      GRPC_RAG_ADDRESS: dns:///rag-service:9097
      APP_GRPC_AUTH_SERVICE_SECRET: ${APP_GRPC_AUTH_SERVICE_SECRET:-change-me-shared-secret}
      APP_GRPC_PROFILE_SERVICE_SECRET: ${APP_GRPC_PROFILE_SERVICE_SECRET:-change-me-shared-secret}
      APP_GRPC_FILE_SERVICE_SECRET: ${APP_GRPC_FILE_SERVICE_SECRET:-change-me-shared-secret}
      APP_GRPC_CHAT_SERVICE_SECRET: ${APP_GRPC_CHAT_SERVICE_SECRET:-change-me-shared-secret}
      APP_GRPC_RAG_SERVICE_SECRET: ${APP_GRPC_RAG_SERVICE_SECRET:-change-me-shared-secret}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'cat < /dev/null > /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ai-platform-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
    container_name: aiplatform-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ai-platform-network

# =============================================================================
# VOLUMES & NETWORKS
# =============================================================================

volumes:
  auth_postgres_data:
    name: aiplatform_auth_postgres_data
  profile_postgres_data:
    name: aiplatform_profile_postgres_data
  file_postgres_data:
    name: aiplatform_file_postgres_data
  chat_postgres_data:
    name: aiplatform_chat_postgres_data
  rag_postgres_data:
    name: aiplatform_rag_postgres_data
  file_storage_data:
    name: aiplatform_file_storage_data
  redis_data:
    name: aiplatform_redis_data
  qdrant_data:
    name: aiplatform_qdrant_data
  tei_models:
    name: aiplatform_tei_models

networks:
  ai-platform-network:
    name: ai-platform-network
    driver: bridge
