server:
  port: ${SERVER_PORT:8082}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:auth_user}
    password: ${SPRING_DATASOURCE_PASSWORD:auth_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  environment: ${APP_ENV:production}
  grpc:
    auth:
      service-secret: ${APP_GRPC_AUTH_SERVICE_SECRET:}
  kafka:
    topics:
      user-registered: ${APP_KAFKA_TOPIC_USER_REGISTERED:user.registered.v1}
      user-email-verification: ${APP_KAFKA_TOPIC_USER_EMAIL_VERIFICATION:user.email.verification.v1}
  jwt:
    issuer: ${APP_JWT_ISSUER:ai-learning-platform-auth}
    audience: ${APP_JWT_AUDIENCE:ai-learning-platform-clients}
    key-id: ${APP_JWT_KEY_ID:primary}
    access-token-expiration-minutes: ${APP_JWT_ACCESS_EXP_MINUTES:15}
    refresh-token-expiration-days: ${APP_JWT_REFRESH_EXP_DAYS:7}
    private-key-location: ${APP_JWT_PRIVATE_KEY_LOCATION:file:/run/secrets/jwt_private_key.pem}
    public-key-location: ${APP_JWT_PUBLIC_KEY_LOCATION:file:/run/secrets/jwt_public_key.pem}
    private-key-pem: ${APP_JWT_PRIVATE_KEY_PEM:}
    public-key-pem: ${APP_JWT_PUBLIC_KEY_PEM:}
